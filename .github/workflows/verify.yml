name: 校验

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 检查 extension.js 语法
        shell: pwsh
        run: node --check extension.js

      # 用 Windows PowerShell 5.1 跑，不用 pwsh：整个项目的编码纪律
      # （.ps1 要带 BOM、Set-Content -Encoding UTF8 会带 BOM 等）都是针对 PS 5.1 的，
      # 换成 PS 7 会验出一套和实际运行环境不一样的行为
      - name: 运行发布前自检（Windows PowerShell 5.1）
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File ./verify.ps1